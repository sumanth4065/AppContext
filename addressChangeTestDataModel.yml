          street: "8585 N Stemmons Fwy"
          city: "Dallas"
          state: "TX"
          zipcode: "75247"

        - id: TX_RES_004
          full_address: "1950 Market Center Blvd, Dallas, TX 75207"
          street: "1950 Market Center Blvd"
          city: "Dallas"
          state: "TX"
          zipcode: "75207"

      mailing:
        - id: TX_MAIL_001
          full_address: "7919 Glenview Dr, Houston, TX 77061"
          street: "7919 Glenview Dr"
          city: "Houston"
          state: "TX"
          zipcode: "77061"
          
        - id: TX_MAIL_002
          full_address: "553 Darley Oak Dr, Dripping Springs, TX 78620"
          street: "553 Darley Oak Dr"
          city: "Dripping Springs"
          state: "TX"
