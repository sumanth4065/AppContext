test_data_model:
  version: 1.0
  market_scope: TX
  description: >
    Test personas and address data for AAA Address Change flow (Texas market).
    Designed for AI-driven test generation with strict autocomplete enforcement
    and deterministic outcomes.

  # --------------------------------------------------
  # Market Configuration
  # --------------------------------------------------
  market:
    state: TX
    default_zipcode: 75025

  # --------------------------------------------------
  # Address Pool (Real, Autocomplete-Compatible)
  # --------------------------------------------------
  address_pool:
    TX:
      residential:
        - id: TX_RES_001
          full_address: "4800 Eldorado Pkwy, Frisco, TX 75033"
          street: "4800 Eldorado Pkwy"
          city: "Frisco"
          state: "TX"
          zipcode: "75033" 
          
        - id: TX_RES_002
          full_address: "6200 Stonebridge Dr, McKinney, TX 75070"
          street: "6200 Stonebridge Dr"
          city: "McKinney"
          state: "TX"
          zipcode: "75070"

        - id: TX_RES_003
